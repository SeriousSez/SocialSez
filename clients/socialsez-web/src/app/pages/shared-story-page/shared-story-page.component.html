<section class="shared-page">
    <article class="shared-card" *ngIf="loading">
        <p>Loading story...</p>
    </article>

    <article class="shared-card" *ngIf="notFound && !loading">
        <h3>Story unavailable</h3>
        <p>This story is expired, removed, or the link is invalid.</p>
    </article>

    <article class="shared-card" *ngIf="error && !loading && !notFound">
        <h3>Something went wrong</h3>
        <p>{{ error }}</p>
    </article>

    <article *ngIf="story as item">
        <header class="meta-row">
            <div class="author-meta">
                <img class="author-avatar" *ngIf="item.authorImageUrl; else authorInitial" [src]="item.authorImageUrl" loading="eager" decoding="async" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Creator image" />
                <ng-template #authorInitial>
                    <div class="author-avatar">{{ (item.authorHandle[0] || '?') | uppercase }}</div>
                </ng-template>
                <div>
                    <strong>@{{ item.authorHandle }}</strong>
                    <p>{{ item.createdAtUtc | date:'medium' }}</p>
                </div>
            </div>
            <button type="button" class="comments-toggle" (click)="copyLinkAsync()" [attr.aria-label]="copiedLink ? 'Story link copied' : 'Copy story link'" [attr.title]="copiedLink ? 'Copied' : 'Copy link'">
                <i class="fa-duotone" [class.fa-light]="!copiedLink" [class.fa-solid]="copiedLink" [class.fa-link]="!copiedLink" [class.fa-check]="copiedLink" aria-hidden="true"></i>
                <span class="action-label">{{ copiedLink ? 'Copied' : 'Copy link' }}</span>
            </button>
        </header>

        <p class="content" *ngIf="item.caption as caption">
            <ng-container *ngFor="let line of contentLines(caption); let isLast = last">
                <span class="content-line">
                    <ng-container *ngFor="let part of line">
                        <a *ngIf="part.hashtag; else storyPlainText" class="hashtag" [href]="'/hashtags/' + part.hashtag" (pointerup)="goToHashtag(part.hashtag, $event)" (click)="goToHashtag(part.hashtag, $event)">{{ part.text }}</a>
                        <ng-template #storyPlainText>{{ part.text }}</ng-template>
                    </ng-container>
                </span>
                <br *ngIf="!isLast" />
            </ng-container>
        </p>

        <!-- <p class="hashtag-debug">Hashtag clicks: {{ hashtagClickCount }} <span *ngIf="lastClickedHashtag">(last: #{{ lastClickedHashtag }})</span></p> -->

        <div class="story-media-frame">
            <ng-container *ngIf="isVideoMedia(item.mediaUrl); else imageStory">
                <video class="media" [src]="item.mediaUrl" controls autoplay muted loop playsinline preload="auto"></video>
            </ng-container>
            <ng-template #imageStory>
                <img class="media" [src]="item.mediaUrl" loading="eager" decoding="async" alt="Shared story media" />
            </ng-template>
        </div>
    </article>
</section>
