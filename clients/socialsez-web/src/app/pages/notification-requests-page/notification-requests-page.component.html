<section class="page">
    <header class="page-head">
        <div>
            <h2>Follow Requests</h2>
            <p>Review and respond to incoming follow requests.</p>
        </div>
        <div class="actions">
            <a class="ghost-link" routerLink="/notifications">Back to notifications</a>
            <button class="ghost refresh-icon-btn" type="button" (click)="loadRequests()" aria-label="Refresh requests" title="Refresh requests">
                <i class="fa-duotone fa-light fa-arrows-rotate" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <section class="card">
        <p class="meta" *ngIf="loading">Loading follow requests...</p>
        <p class="meta" *ngIf="!loading && !requests.length">No pending follow requests.</p>

        <article class="request" *ngFor="let request of requests">
            <div>
                <a class="profile-link" [routerLink]="['/users', request.followerHandle]">@{{ request.followerHandle }}</a>
                <p class="meta">{{ request.createdAtUtc | date:'medium' }}</p>
            </div>
            <div class="actions">
                <button type="button" (click)="approveRequest(request.followerId)">Approve</button>
                <button class="ghost" type="button" (click)="declineRequest(request.followerId)">Decline</button>
            </div>
        </article>
    </section>

    <p class="status" [class.is-success]="statusTone === 'success'" *ngIf="status">{{ status }}</p>
</section>
