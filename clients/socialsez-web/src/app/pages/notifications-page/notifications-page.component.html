<section class="page">
    <header class="page-head">
        <div>
            <h2>Notifications</h2>
            <p>See activity updates and mark them as read.</p>
        </div>
        <div class="actions">
            <a class="ghost-link" routerLink="/notifications/requests">Requests</a>
            <button class="ghost" type="button" (click)="markAllRead()" [disabled]="!unreadCount">Mark all read</button>
            <button class="ghost refresh-icon-btn" type="button" (click)="loadNotifications()" aria-label="Refresh notifications" title="Refresh notifications">
                <i class="fa-duotone fa-light fa-arrows-rotate" aria-hidden="true"></i>
            </button>
        </div>
    </header>

    <nav class="filters" aria-label="Notification filters">
        <button type="button" class="ghost" [class.is-active]="activeFilter === 'all'" (click)="setFilter('all')">All ({{ notifications.length }})</button>
        <button type="button" class="ghost" [class.is-active]="activeFilter === 'unread'" (click)="setFilter('unread')">Unread ({{ unreadCount }})</button>
    </nav>

    <section class="card">
        <div class="notification-skeleton" *ngIf="loading">
            <article class="notification" *ngFor="let row of skeletonRows">
                <div class="body">
                    <span class="line line-lg"></span>
                    <span class="line line-sm"></span>
                </div>
                <div class="action-skeleton"></div>
            </article>
        </div>

        <p class="meta" *ngIf="!loading && !filteredNotifications.length && activeFilter === 'all'">No notifications yet.</p>
        <p class="meta" *ngIf="!loading && !filteredNotifications.length && activeFilter === 'unread'">You’re all caught up.</p>

        <article class="notification" *ngFor="let notification of filteredNotifications; trackBy: trackByNotification" [class.request-row]="isFollowRequest(notification)" [class.unread]="!notification.isRead" (click)="openRequest(notification)">
            <div class="body">
                <a class="profile-link" *ngIf="isFollowRequest(notification) && notification.actorHandle" [routerLink]="['/users', notification.actorHandle]" (click)="$event.stopPropagation()">@{{ notification.actorHandle }}</a>
                <div class="message-row">
                    <span class="unread-dot" *ngIf="!notification.isRead" aria-hidden="true"></span>
                    <strong>{{ notification.message }}</strong>
                </div>
                <p class="meta">{{ notification.createdAtUtc | date:'medium' }}</p>
            </div>
            <div class="actions">
                <button *ngIf="isFollowRequest(notification)" type="button" (click)="approveRequest(notification, $event)">Approve</button>
                <button *ngIf="isFollowRequest(notification)" class="ghost" type="button" (click)="declineRequest(notification, $event)">Decline</button>
                <button class="ghost" type="button" (click)="toggleRead(notification, $event)">{{ notification.isRead ? 'Mark unread' : 'Mark read' }}</button>
            </div>
        </article>
    </section>
</section>
