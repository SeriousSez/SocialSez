<section class="shared-page">
    <article class="shared-card" *ngIf="loading">
        <app-skeleton [height]="'16px'" [width]="'32%'"></app-skeleton>
        <app-skeleton [height]="'14px'" [width]="'100%'"></app-skeleton>
        <app-skeleton [height]="'14px'" [width]="'84%'"></app-skeleton>
        <app-skeleton [height]="'280px'" [width]="'100%'"></app-skeleton>
    </article>

    <article class="shared-card" *ngIf="notFound && !loading">
        <h3>Post unavailable</h3>
        <p>This post was removed or the link is invalid.</p>
    </article>

    <article class="shared-card" *ngIf="error && !loading && !notFound">
        <h3>Something went wrong</h3>
        <p>{{ error }}</p>
    </article>

    <article *ngIf="post as item">
        <header class="meta-row">
            <div class="author-meta">
                <img class="author-avatar" *ngIf="item.authorImageUrl; else authorInitial" [src]="item.authorImageUrl" loading="lazy" decoding="async" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Creator image" />
                <ng-template #authorInitial>
                    <div class="author-avatar">{{ (item.authorHandle[0] || '?') | uppercase }}</div>
                </ng-template>
                <div>
                    <strong>@{{ item.authorHandle }}</strong>
                    <p>{{ item.createdAtUtc | date:'medium' }}</p>
                </div>
            </div>
            <button type="button" class="comments-toggle" (click)="copyLinkAsync()" [attr.aria-label]="copiedLink ? 'Post link copied' : 'Copy post link'" [attr.title]="copiedLink ? 'Copied' : 'Copy link'">
                <i class="fa-duotone" [class.fa-light]="!copiedLink" [class.fa-solid]="copiedLink" [class.fa-link]="!copiedLink" [class.fa-check]="copiedLink" aria-hidden="true"></i>
                <span class="action-label">{{ copiedLink ? 'Copied' : 'Copy link' }}</span>
            </button>
        </header>

        <p class="content" *ngIf="item.content as content">
            <ng-container *ngFor="let line of contentLines(content); let isLast = last">
                <span class="content-line">
                    <ng-container *ngFor="let part of line">
                        <a *ngIf="part.hashtag; else postPlainText" class="hashtag" [href]="'/hashtags/' + part.hashtag" (pointerup)="goToHashtag(part.hashtag, $event)" (click)="goToHashtag(part.hashtag, $event)">{{ part.text }}</a>
                        <ng-template #postPlainText>{{ part.text }}</ng-template>
                    </ng-container>
                </span>
                <br *ngIf="!isLast" />
            </ng-container>
        </p>

        <ng-container *ngIf="item.imageUrl as mediaUrl">
            <video class="media" *ngIf="isVideoMedia(mediaUrl); else imageMedia" [src]="mediaUrl" controls playsinline preload="metadata"></video>
            <ng-template #imageMedia>
                <img class="media" [src]="mediaUrl" loading="lazy" decoding="async" alt="Shared post media" />
            </ng-template>
        </ng-container>
    </article>
</section>
