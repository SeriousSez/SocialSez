<section class="shared-page">
    <header class="shared-head">
        <h2>Shared Reel</h2>
        <a routerLink="/auth">Sign in</a>
    </header>

    <article class="shared-card" *ngIf="loading">
        <p>Loading reel...</p>
    </article>

    <article class="shared-card" *ngIf="notFound && !loading">
        <h3>Reel unavailable</h3>
        <p>This reel was removed or the link is invalid.</p>
    </article>

    <article class="shared-card" *ngIf="error && !loading && !notFound">
        <h3>Something went wrong</h3>
        <p>{{ error }}</p>
    </article>

    <article class="shared-card" *ngIf="reel as item">
        <header class="meta-row">
            <div class="author-meta">
                <img class="author-avatar" *ngIf="item.authorImageUrl; else authorInitial" [src]="item.authorImageUrl" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Creator image" />
                <ng-template #authorInitial>
                    <div class="author-avatar">{{ (item.authorHandle[0] || '?') | uppercase }}</div>
                </ng-template>
                <div>
                    <strong>@{{ item.authorHandle }}</strong>
                    <p>{{ item.createdAtUtc | date:'medium' }}</p>
                </div>
            </div>
            <button type="button" class="ghost" (click)="copyLinkAsync()">Copy link</button>
        </header>

        <p class="content" *ngIf="item.caption">{{ item.caption }}</p>

        <video class="media" [poster]="item.thumbnailUrl || null" [src]="item.videoUrl" controls autoplay muted loop playsinline preload="auto"></video>
    </article>
</section>
