<div class="story-viewer" [class.closing]="isClosing" *ngIf="activeStory as story" (click)="close()" role="dialog" aria-modal="true" aria-label="Story viewer">
    <article class="story-viewer-card" (click)="$event.stopPropagation()">
        <ng-container *ngIf="nextStory as upcomingStory">
            <video *ngIf="isVideoStory(upcomingStory.mediaUrl); else preloadNextStoryImage" class="story-preload-media" [src]="upcomingStory.mediaUrl" [attr.poster]="upcomingStory.thumbnailUrl || null" preload="metadata" muted playsinline tabindex="-1" aria-hidden="true"></video>
            <ng-template #preloadNextStoryImage>
                <img class="story-preload-media" [src]="upcomingStory.mediaUrl" alt="" aria-hidden="true" />
            </ng-template>
        </ng-container>

        <div class="story-progress" aria-hidden="true">
            <span class="story-progress-segment" *ngFor="let segment of storySegments">
                <span class="story-progress-fill" [style.width.%]="getStorySegmentProgress(segment)"></span>
            </span>
        </div>

        <header class="story-viewer-head">
            <div class="story-author-meta">
                <a class="story-author-link" href="" (click)="openAuthorProfile($event)" aria-label="View author profile">
                    <div class="story-author">
                        <img *ngIf="activeStoryGroup?.authorImageUrl" [src]="activeStoryGroup?.authorImageUrl" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Story author" />
                        <span>@{{ activeStoryGroup?.authorHandle }}</span>
                    </div>
                </a>
                <span class="story-age">{{ formatStoryAge(story.createdAtUtc) }}</span>
            </div>
            <div class="story-head-actions">
                <button type="button" *ngIf="canDelete" class="story-delete-action" (click)="onDeleteClick()" [disabled]="deletingStory" [attr.aria-label]="deletingStory ? 'Deleting story' : 'Delete story'">
                    <i class="fa-duotone" [class.fa-solid]="deletingStory" [class.fa-light]="!deletingStory" [class.fa-spinner-third]="deletingStory" [class.fa-spin]="deletingStory" [class.fa-trash]="!deletingStory" aria-hidden="true"></i>
                </button>
                <button type="button" *ngIf="canReport" class="story-delete-action" (click)="onReportClick()" [disabled]="reportingStory" [attr.aria-label]="reportingStory ? 'Reporting story' : 'Report story'">
                    <i class="fa-duotone" [class.fa-solid]="reportingStory" [class.fa-light]="!reportingStory" [class.fa-spinner-third]="reportingStory" [class.fa-spin]="reportingStory" [class.fa-flag]="!reportingStory" aria-hidden="true"></i>
                </button>
                <button type="button" *ngIf="isVideoStory(story.mediaUrl)" (click)="toggleStoryMute()" [attr.aria-label]="muteLabel">
                    <i class="fa-duotone" [class.fa-light]="true" [class.fa-volume-xmark]="storyMuted" [class.fa-volume-high]="!storyMuted" aria-hidden="true"></i>
                </button>
                <button type="button" (click)="togglePause()" [attr.aria-label]="pauseLabel">
                    <i class="fa-duotone" [class.fa-light]="true" [class.fa-play]="paused" [class.fa-pause]="!paused" aria-hidden="true"></i>
                </button>
                <button type="button" (click)="close()" aria-label="Close story"><i class="fa-duotone fa-light fa-xmark" aria-hidden="true"></i></button>
            </div>
        </header>

        <div class="story-media-wrap">
            <ng-container *ngIf="!shouldHideSensitiveStory(); else hiddenStoryMedia">
                <video #storyVideoEl *ngIf="isVideoStory(story.mediaUrl) && !videoPlaybackError; else imageStory" [src]="story.mediaUrl" [attr.poster]="story.thumbnailUrl || null" autoplay [muted]="storyMuted" playsinline preload="auto" (loadeddata)="onVideoLoadedData(storyVideoEl)"
                    (play)="onVideoPlay()" (pause)="onVideoPause()" (timeupdate)="onVideoTimeUpdate(storyVideoEl)" (ended)="onVideoEnded()" (error)="onVideoError()"></video>
                <ng-template #imageStory>
                    <img [src]="getStoryImageUrl(story)" alt="Story" (load)="onImageLoad()" (error)="onImageError()" />
                </ng-template>

                <div class="story-media-loader" *ngIf="mediaLoading" aria-hidden="true">
                    <app-skeleton width="100%" height="100%" radius="0"></app-skeleton>
                    <span class="story-media-loader-dot"></span>
                </div>
            </ng-container>

            <ng-template #hiddenStoryMedia>
                <div class="story-sensitive-placeholder">
                    <p>This story is marked as sensitive media.</p>
                    <button type="button" (click)="revealSensitiveStory()">Show story</button>
                </div>
            </ng-template>

            <p class="story-caption" *ngIf="story.caption">{{ story.caption }}</p>
        </div>

        <button type="button" class="story-nav previous" (click)="showPrevious()" [disabled]="!hasPreviousStory" aria-label="Previous story"></button>
        <button type="button" class="story-nav next" (click)="showNext()" aria-label="Next story"></button>

        <footer class="story-viewer-actions">
            <input class="story-reply" type="text" [value]="replyDraft" (input)="replyDraft = $any($event.target).value" (keydown.enter)="onReplySubmit()" [disabled]="sendingReply" [placeholder]="'Reply to @' + (activeStoryGroup?.authorHandle ?? 'user') + '...'" />
            <div class="story-quick-actions">
                <button type="button" class="like-action" [class.active]="liked" (click)="onLikeClick()" aria-label="Like story">{{ liked ? '♥' : '♡' }}</button>
                <button type="button" class="share-action" [class.active]="savedToCollection" *ngIf="canSaveToCollection" (click)="onSaveToCollectionClick()" [disabled]="savingToCollection"
                    [attr.aria-label]="savingToCollection ? 'Saving to collection' : (savedToCollection ? 'Saved to collection' : 'Save to collection')">
                    <i class="fa-duotone" [class.fa-solid]="savingToCollection || savedToCollection" [class.fa-light]="!savingToCollection && !savedToCollection" [class.fa-spinner-third]="savingToCollection" [class.fa-spin]="savingToCollection" [class.fa-bookmark]="!savingToCollection"
                        aria-hidden="true"></i>
                </button>
                <button type="button" class="share-action" (click)="onShareClick()" [disabled]="sharingStory" aria-label="Share story in message"><i class="fa-duotone fa-light fa-paper-plane" aria-hidden="true"></i></button>
                <button type="button" class="share-action" (click)="onCopyLinkClick()" aria-label="Copy story link"><i class="fa-duotone" [class.fa-light]="!copyLinkCopied" [class.fa-solid]="copyLinkCopied" [class.fa-link]="!copyLinkCopied" [class.fa-check]="copyLinkCopied"
                        aria-hidden="true"></i></button>
                <button type="button" *ngIf="replyDraft.trim()" (click)="onReplySubmit()" [disabled]="sendingReply" aria-label="Send reply">➤</button>
            </div>
        </footer>
        <p class="story-viewer-error" *ngIf="errorMessage">{{ errorMessage }}</p>
    </article>
</div>
