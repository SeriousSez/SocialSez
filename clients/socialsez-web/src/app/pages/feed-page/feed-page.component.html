<section class="page">
    <header class="page-head">
        <h2>Home Feed</h2>
        <div class="actions">
            <button type="button" (click)="openComposer()">New Post</button>
        </div>
    </header>

    <app-post-composer *ngIf="showComposer" [showCancel]="true" (posted)="onComposerPosted()" (canceled)="onComposerCanceled()"></app-post-composer>

    <section class="feed-skeleton" *ngIf="loading" aria-label="Loading feed">
        <article class="feed-skeleton-card" *ngFor="let _ of [1, 2, 3]">
            <div class="feed-skeleton-head">
                <app-skeleton width="34px" height="34px" radius="999px"></app-skeleton>
                <div class="feed-skeleton-meta">
                    <app-skeleton width="120px" height="12px"></app-skeleton>
                    <app-skeleton width="84px" height="10px"></app-skeleton>
                </div>
            </div>

            <app-skeleton width="100%" height="13px"></app-skeleton>
            <app-skeleton width="92%" height="13px"></app-skeleton>
            <app-skeleton width="55%" height="13px"></app-skeleton>
            <app-skeleton width="100%" height="140px" radius="12px"></app-skeleton>
        </article>
    </section>
    <p class="error" *ngIf="!loading && error">{{ error }}</p>
    <button class="retry" *ngIf="!loading && error" (click)="load()">Retry</button>

    <div class="list" *ngIf="!loading && !error && feed.length; else emptyState">
        <app-post-card *ngFor="let post of feed" [post]="post" [content]="displayPostContent(post)" [reacting]="reactingPostId === post.id" [busy]="reactingPostId === post.id || savingPost || deletingPostId === post.id || sharingPostId === post.id" [viewerProfileId]="currentProfileId"
            [showActions]="canManagePost(post)" [isEditing]="editingPostId === post.id" [editValue]="editContent" [savingEdit]="savingPost" [deleting]="deletingPostId === post.id" (editValueChange)="editContent = $event" (startEdit)="startEdit(post)" (saveEdit)="saveEdit(post.id)"
            (cancelEdit)="cancelEdit()" (deletePost)="deletePost(post.id)" (toggleLike)="toggleLike(post)" (setReaction)="setReaction(post, $event)" (clearReaction)="clearReaction(post)" (addComment)="addComment(post, $event)" (updateComment)="updateComment(post, $event.commentId, $event.content)"
            (deleteComment)="deleteComment(post, $event)" (setCommentReaction)="setCommentReaction(post, $event.commentId, $event.reactionType)" (clearCommentReaction)="clearCommentReaction(post, $event)" (shareToFeed)="sharePostToFeed(post)" (shareToChat)="sharePostToChat(post)">
            <div post-header class="author">
                <img class="avatar" *ngIf="post.authorImageUrl; else authorInitial" [src]="post.authorImageUrl" alt="Author image" />
                <ng-template #authorInitial>
                    <div class="avatar">{{ post.authorHandle[0] }}</div>
                </ng-template>
                <div class="meta"><a class="author-link" [routerLink]="['/users', post.authorHandle]">@{{ post.authorHandle }}</a> · {{ post.createdAtUtc | date:'short' }}</div>
            </div>
        </app-post-card>
    </div>

    <ng-template #emptyState>
        <p class="empty" *ngIf="!loading && !error">No posts yet. Follow people or create your first post to kick off your timeline.</p>
    </ng-template>
</section>

<app-share-post-modal [open]="!!pendingSharePost && pendingShareTarget === 'feed'" [post]="pendingSharePost" [target]="'feed'" [busy]="!!sharingPostId" [initialText]="shareNote" (cancel)="cancelShareModal()" (confirm)="submitShare($event)">
</app-share-post-modal>

<app-share-post-message-modal [open]="!!pendingSharePost && pendingShareTarget === 'chat'" [post]="pendingSharePost" [busy]="!!sharingPostId" (cancel)="cancelShareModal()" (confirm)="submitShareAsMessage($event)">
</app-share-post-message-modal>
