<section class="page blog-shell" [ngStyle]="themeStyles">
    <p class="error" *ngIf="!loading && error">{{ error }}</p>
    <article class="post post-skeleton" *ngIf="loading" aria-label="Loading blog post">
        <header class="post-head blog-header">
            <span class="skeleton-line skeleton-back"></span>
            <span class="skeleton-line skeleton-title"></span>
            <span class="skeleton-line skeleton-meta"></span>
            <div class="tags">
                <span class="skeleton-pill"></span>
                <span class="skeleton-pill"></span>
                <span class="skeleton-pill"></span>
            </div>
        </header>

        <div class="skeleton-hero" aria-hidden="true"></div>

        <div class="content">
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph short"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph shorter"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph short"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph shortest"></span>
        </div>
    </article>

    <article class="post" *ngIf="!loading && !error && post as item">
        <header class="post-head">
            <a class="back-link" [routerLink]="['/blogs', handle, blogSlug]">Back to Blog</a>
            <h1>
                <ng-container *ngFor="let line of splitHashtagText(item.title); let isLast = last">
                    <ng-container *ngFor="let part of line">
                        <a *ngIf="part.hashtag; else blogPostTitleText" class="hashtag" [routerLink]="['/discover']" [queryParams]="{ q: part.hashtag, type: 'all' }">{{ part.text }}</a>
                        <ng-template #blogPostTitleText>{{ part.text }}</ng-template>
                    </ng-container>
                    <br *ngIf="!isLast" />
                </ng-container>
            </h1>
            <p class="meta subtitle">By @{{ item.authorHandle }} · {{ (item.publishedAtUtc ?? item.updatedAtUtc) | date:'medium' }}</p>
            <div class="tags" *ngIf="item.tags.length">
                <a *ngFor="let tag of item.tags" class="hashtag" [routerLink]="['/discover']" [queryParams]="{ q: tag, type: 'all' }">#{{ tag }}</a>
            </div>
        </header>

        <img *ngIf="item.coverImageUrl" class="cover-media-img" [src]="item.coverImageUrl" [alt]="item.title" loading="eager" decoding="async" />

        <div class="content" [innerHTML]="renderedPostContent"></div>

        <section class="blog-actions" *ngIf="allowLikes || allowComments || allowShares || allowEmbeds">
            <button type="button" class="ghost" *ngIf="allowLikes" disabled title="Blog likes will be enabled soon">Like</button>
            <button type="button" class="ghost" *ngIf="allowComments" disabled title="Blog comments will be enabled soon">Comment</button>
            <button type="button" class="ghost" *ngIf="allowShares" (click)="copyShareLinkAsync()">{{ copiedShareLink ? 'Link copied' : 'Share' }}</button>
            <button type="button" class="ghost" *ngIf="allowEmbeds" (click)="openEmbedToolsInNewTab()">Embed</button>
        </section>
    </article>
</section>
