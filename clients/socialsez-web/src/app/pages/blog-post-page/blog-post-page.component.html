<section class="page blog-shell" [ngStyle]="themeStyles">
    <style *ngIf="customCss" [textContent]="customCss"></style>

    <p class="error" *ngIf="!loading && error">{{ error }}</p>
    <p class="muted" *ngIf="loading">Loading blog post...</p>

    <article class="post" *ngIf="!loading && !error && post as item">
        <header class="post-head">
            <a class="back-link" [routerLink]="['/blogs', handle, blogSlug]">Back to Blog</a>
            <h1>{{ item.title }}</h1>
            <p class="meta">By @{{ item.authorHandle }} · {{ (item.publishedAtUtc ?? item.updatedAtUtc) | date:'medium' }}</p>
            <div class="tags" *ngIf="item.tags.length">
                <span *ngFor="let tag of item.tags">#{{ tag }}</span>
            </div>
        </header>

        <img *ngIf="item.coverImageUrl" [src]="item.coverImageUrl" [alt]="item.title" class="cover" />

        <div class="content">{{ item.content }}</div>
    </article>
</section>
