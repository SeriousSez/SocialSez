<section class="page blog-shell" [ngStyle]="themeStyles">
    <p class="error" *ngIf="!loading && error">{{ error }}</p>
    <article class="post post-skeleton" *ngIf="loading" [attr.aria-label]="'blogPost.loading.aria' | translate">
        <header class="post-head blog-header">
            <span class="skeleton-line skeleton-back"></span>
            <span class="skeleton-line skeleton-title"></span>
            <span class="skeleton-line skeleton-meta"></span>
            <div class="tags">
                <span class="skeleton-pill"></span>
                <span class="skeleton-pill"></span>
                <span class="skeleton-pill"></span>
            </div>
        </header>

        <div class="skeleton-hero" aria-hidden="true"></div>

        <div class="content">
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph short"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph shorter"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph short"></span>
            <span class="skeleton-line skeleton-paragraph"></span>
            <span class="skeleton-line skeleton-paragraph shortest"></span>
        </div>
    </article>

    <article class="post" *ngIf="!loading && !error && post as item">
        <header class="post-head">
            <a class="back-link" [routerLink]="['/blogs', handle, blogSlug]">{{ 'blogPost.actions.backToBlog' | translate }}</a>
            <h1>
                <ng-container *ngFor="let line of splitHashtagText(activeTitle); let isLast = last">
                    <ng-container *ngFor="let part of line">
                        <a *ngIf="part.hashtag; else blogPostTitleText" class="hashtag" [routerLink]="['/discover']" [queryParams]="{ q: part.hashtag, type: 'all' }">{{ part.text }}</a>
                        <ng-template #blogPostTitleText>{{ part.text }}</ng-template>
                    </ng-container>
                    <br *ngIf="!isLast" />
                </ng-container>
            </h1>
            <p class="meta subtitle">{{ 'blogPost.meta.byDate' | translate:{ handle: item.authorHandle, date: ((item.publishedAtUtc ?? item.updatedAtUtc) | date:'medium') } }}</p>
            <div class="tags" *ngIf="item.tags.length">
                <a *ngFor="let tag of item.tags" class="hashtag" [routerLink]="['/discover']" [queryParams]="{ q: tag, type: 'all' }">#{{ tag }}</a>
            </div>
        </header>

        <img *ngIf="item.coverImageUrl" class="cover-media-img" [src]="item.coverImageUrl" [alt]="item.title" loading="eager" decoding="async" />

        <div class="content" [innerHTML]="activeRenderedContent"></div>
        <app-translate-content [text]="(item.title || '') + '\n\n' + (item.content || '')" [inlineMode]="true" (translationChanged)="onTranslationChanged($event)"></app-translate-content>

        <section class="blog-actions" *ngIf="allowLikes || allowComments || allowShares || allowEmbeds || canToggleSave">
            <button type="button" class="ghost" *ngIf="allowLikes" disabled [attr.title]="'blogPost.hints.likesSoon' | translate">{{ 'blogPost.actions.like' | translate }}</button>
            <button type="button" class="ghost" *ngIf="allowComments" disabled [attr.title]="'blogPost.hints.commentsSoon' | translate">{{ 'blogPost.actions.comment' | translate }}</button>
            <button type="button" class="ghost" *ngIf="canToggleSave" [disabled]="savingPost" (click)="toggleSavePostAsync()">{{ item.isSavedByMe ? ('blogPost.actions.unsave' | translate) : ('blogPost.actions.save' | translate) }}</button>
            <button type="button" class="ghost" *ngIf="allowShares" (click)="copyShareLinkAsync()">{{ copiedShareLink ? ('blogPost.actions.linkCopied' | translate) : ('blogPost.actions.share' | translate) }}</button>
            <button type="button" class="ghost" *ngIf="allowEmbeds" (click)="openEmbedToolsInNewTab()">{{ 'blogPost.actions.embed' | translate }}</button>
        </section>
    </article>
</section>
