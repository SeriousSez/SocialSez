<article class="shared-post-preview">
    <header class="shared-post-head">
        <img class="shared-post-author-avatar" *ngIf="shared.authorImageUrl" [src]="shared.authorImageUrl" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Shared post author avatar" />
        <span class="shared-post-author-fallback" *ngIf="!shared.authorImageUrl">{{ (shared.authorHandle || 'S').charAt(0).toUpperCase() }}</span>
        <div class="shared-post-author-meta">
            <span>Shared post from</span>
            <strong>@{{ shared.authorHandle }}</strong>
        </div>

        <button type="button" class="shared-post-open" (click)="openPost($event)">Open post</button>
    </header>

    <img class="shared-post-image" *ngIf="shared.imageUrl" [src]="shared.imageUrl" alt="Shared post media" />

    <p class="shared-post-content" *ngIf="previewText as text">{{ text }}</p>
</article>
