<section class="composer">
    <h3>{{ title }}</h3>
    <p class="sub">{{ subtitle }}</p>

    <div class="composer-textarea-wrap">
        <textarea #composerTextarea rows="7" [ngModel]="content" (ngModelChange)="onContentInput($event, composerTextarea)" (keyup)="onContentCursor(composerTextarea)" (click)="onContentCursor(composerTextarea)" (blur)="onContentBlur()" placeholder="What’s new today?"
            [disabled]="uploadingMedia"></textarea>

        <div class="mention-suggestions" *ngIf="mentionOpen || mentionLoading">
            <p class="mention-hint" *ngIf="mentionLoading">Searching users...</p>
            <button type="button" *ngFor="let profile of mentionResults" (mousedown)="$event.preventDefault()" (click)="selectMention(profile)">
                <span class="mention-avatar fallback" *ngIf="!profile.imageUrl">{{ (profile.displayName || profile.handle).charAt(0).toUpperCase() }}</span>
                <img class="mention-avatar" *ngIf="profile.imageUrl as avatar" [src]="avatar" alt="Profile avatar" />
                <span class="mention-meta">
                    <span class="mention-name">{{ profile.displayName }}</span>
                    <span class="mention-subline">{{ profile.bio || ('@' + profile.handle) }}</span>
                </span>
            </button>
        </div>
    </div>
    <label class="upload">Post Media <input type="file" accept="image/*,video/mp4,video/webm,video/quicktime,video/x-m4v,video/ogg" (change)="onPostMediaSelected($event)" [disabled]="uploadingMedia" /></label>
    <p class="meta" *ngIf="uploadingMedia">Uploading media and publishing...</p>

    <section class="crop-panel" *ngIf="mediaPreviewUrl">
        <image-cropper *ngIf="mediaKind === 'image-croppable'" [imageFile]="selectedMediaFile || undefined" [maintainAspectRatio]="false" [resizeToWidth]="1200" [onlyScaleDown]="true" [format]="cropOutputFormat" (imageCropped)="onImageCropped($event)" (imageLoaded)="onImageLoaded($event)"
            (loadImageFailed)="onLoadImageFailed()"></image-cropper>

        <img class="preview" *ngIf="mediaKind === 'image-static'" [src]="mediaPreviewUrl" alt="Selected image preview" />
        <video class="preview" *ngIf="mediaKind === 'video'" [src]="mediaPreviewUrl" controls playsinline preload="metadata"></video>
    </section>

    <div class="actions">
        <span class="meta">{{ content.length }}/500</span>
        <div class="action-buttons">
            <button *ngIf="showCancel" class="ghost" type="button" (click)="cancel()" [disabled]="uploadingMedia">Cancel</button>
            <button class="ghost" type="button" (click)="removePostMedia()" [disabled]="!mediaPreviewUrl || uploadingMedia">Remove Media</button>
            <button type="button" (click)="publish()" [disabled]="(!content.trim() && !mediaPreviewUrl) || uploadingMedia">Publish</button>
        </div>
    </div>

    <p class="status" *ngIf="status">{{ status }}</p>
</section>
