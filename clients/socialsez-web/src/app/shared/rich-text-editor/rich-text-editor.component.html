<div class="comment-compose-shell" [class.expanded]="expanded">
    <div class="comment-compose-top" *ngIf="expanded && editorMode === 'rich'">
        <div class="rich-toolbar" (mousedown)="onRichToolbarMouseDown($event)" (pointerdown)="onRichToolbarPointerDown($event)">
            <button type="button" class="ghost" [class.is-active]="isBoldCommandActive" (click)="applyRichCommand('bold')"><i class="fa-duotone fa-light fa-bold" aria-hidden="true"></i></button>
            <button type="button" class="ghost" [class.is-active]="isItalicCommandActive" (click)="applyRichCommand('italic')"><i class="fa-duotone fa-light fa-italic" aria-hidden="true"></i></button>
            <button type="button" class="ghost" [class.is-active]="isLinkCommandActive" (click)="applyRichCommand('createLink')"><i class="fa-duotone fa-light fa-link" aria-hidden="true"></i></button>
            <button type="button" class="ghost" [class.is-active]="isUnorderedListCommandActive" (click)="applyRichCommand('insertUnorderedList')"><i class="fa-duotone fa-light fa-list" aria-hidden="true"></i></button>
            <button type="button" class="ghost" [class.is-active]="isOrderedListCommandActive" (click)="applyRichCommand('insertOrderedList')"><i class="fa-duotone fa-light fa-list-ol" aria-hidden="true"></i></button>
            <button type="button" class="ghost" [class.is-active]="isSpoilerCommandActive" (click)="applyRichCommand('spoiler')" aria-label="Spoiler" title="Spoiler">
                <i class="fa-duotone fa-light fa-eye-slash" aria-hidden="true"></i>
            </button>
            <button type="button" class="ghost" [class.is-active]="isQuoteCommandActive" (click)="applyRichCommand('formatBlock')" aria-label="Quote" title="Quote">
                <i class="fa-duotone fa-light fa-quote-left" aria-hidden="true"></i>
            </button>
        </div>
    </div>

    <div class="editor-input-wrap">
        <textarea *ngIf="editorMode === 'markdown'" #markdownTextarea name="editorMarkdownDraft" rows="3" [ngModel]="markdownDraft" (ngModelChange)="onMarkdownInput($event, markdownTextarea)" [placeholder]="placeholder" (focus)="expand()" (keyup)="onMarkdownCursor(markdownTextarea)"
            (click)="onMarkdownCursor(markdownTextarea)" (blur)="onEditorBlur()" [style.height.px]="editorHeightPx" [style.min-height.px]="editorHeightPx" [style.max-height.px]="editorHeightPx"></textarea>

        <div *ngIf="editorMode === 'rich'" #richEditor class="rich-editor" contenteditable="true" [attr.data-placeholder]="placeholder" (focus)="expand(); onRichEditorFocus()" (keydown)="onRichEditorKeydown($event)" (keyup)="onRichEditorKeyup()" (input)="onRichEditorInput()"
            (mouseup)="onRichEditorMouseup()" (mousedown)="onRichEditorMousedown($event)" (blur)="onEditorBlur()" [style.height.px]="editorHeightPx" [style.min-height.px]="editorHeightPx" [style.max-height.px]="editorHeightPx"></div>

        <div class="mention-suggestions" *ngIf="mentionOpen || mentionLoading">
            <p class="mention-hint" *ngIf="mentionLoading">Searching users...</p>
            <button type="button" *ngFor="let profile of mentionResults" (mousedown)="$event.preventDefault()" (click)="selectMention(profile)">
                <span class="mention-avatar fallback" *ngIf="!profile.imageUrl">{{ (profile.displayName || profile.handle).charAt(0).toUpperCase() }}</span>
                <img class="mention-avatar" *ngIf="profile.imageUrl as avatar" [src]="avatar" onerror="this.onerror=null;this.src='/assets/images/avatar-fallback.svg';" alt="Profile avatar" />
                <span class="mention-meta">
                    <span class="mention-name">{{ profile.displayName }}</span>
                    <span class="mention-subline">{{ profile.bio || ('@' + profile.handle) }}</span>
                </span>
            </button>
        </div>
    </div>

    <div class="comment-actions" *ngIf="expanded && showActions">
        <p class="meta" *ngIf="errorMessage">{{ errorMessage }}</p>
        <div class="comment-primary-actions">
            <button *ngIf="showModeToggle" type="button" class="ghost mode-toggle-icon" (click)="toggleEditorMode()" [attr.aria-label]="editorMode === 'rich' ? 'Switch to Markdown editor' : 'Switch to Rich Text editor'"
                [attr.title]="editorMode === 'rich' ? 'Switch to Markdown editor' : 'Switch to Rich Text editor'">
                <i *ngIf="editorMode === 'markdown'" class="fa-duotone fa-pen" aria-hidden="true"></i>
                <i *ngIf="editorMode === 'rich'" class="fa-duotone fa-light fa-code" aria-hidden="true"></i>
            </button>
            <button type="button" class="ghost" (click)="$event.stopPropagation(); onCancel()" [disabled]="submitting">Cancel</button>
            <button type="button" (click)="onSubmit()" [disabled]="submitting || !canSubmit">{{ submitting ? submittingLabel : submitLabel }}</button>
        </div>
    </div>
</div>

<div class="link-modal-backdrop" *ngIf="linkModalOpen" (click)="closeLinkModal()">
    <section class="link-modal" role="dialog" aria-modal="true" aria-label="Insert link" (click)="$event.stopPropagation()">
        <h4>Insert Link</h4>

        <label>
            URL
            <input #linkUrlInput type="text" [(ngModel)]="linkModalUrl" placeholder="https://example.com" />
        </label>

        <label>
            Open link in
            <select [(ngModel)]="linkModalTarget">
                <option value="_blank">New tab</option>
                <option value="_self">Current tab</option>
                <option value="_parent">Parent frame</option>
                <option value="_top">Top window</option>
                <option value="custom">Custom target</option>
            </select>
        </label>

        <label *ngIf="linkModalTarget === 'custom'">
            Custom target
            <input type="text" [(ngModel)]="linkModalCustomTarget" placeholder="_blank or myFrame" />
        </label>

        <p class="meta" *ngIf="linkModalError">{{ linkModalError }}</p>

        <div class="actions">
            <button type="button" class="ghost" (click)="closeLinkModal()">Cancel</button>
            <button type="button" (click)="submitLinkModal()">Apply link</button>
        </div>
    </section>
</div>
