<div class="side-card saved-collections-rail">
    <div class="rail-header">
        <h3>Saved</h3>
        <button type="button" class="btn-icon" title="New collection" (click)="creatingCollection = !creatingCollection" aria-label="Create collection">
            <i class="fa-duotone fa-light fa-folder-plus"></i>
        </button>
    </div>

    @if (creatingCollection) {
    <div class="new-collection-form">
        <input type="text" placeholder="Collection name" maxlength="100" [(ngModel)]="newCollectionName" (keydown.enter)="createCollectionAsync()" (keydown.escape)="creatingCollection = false" autofocus />
        <div class="form-actions">
            <button class="btn-primary" (click)="createCollectionAsync()" [disabled]="!newCollectionName.trim()">Create</button>
            <button class="btn-ghost" (click)="creatingCollection = false">Cancel</button>
        </div>
    </div>
    }

    <nav class="saved-nav" aria-label="Saved collections">
        <button class="nav-item" [class.active]="!activeCollectionId" (click)="selectAllAsync()">
            <i class="fa-duotone fa-light fa-bookmark"></i>
            <span>All Saved</span>
            <span class="count">{{ allSavedCount }}</span>
        </button>

        @if (!loading && collections.length === 0) {
        <p class="hint">No collections yet.</p>
        }

        @for (collection of collections; track collection.id) {
        <div class="nav-item-wrapper">
            @if (renamingCollectionId === collection.id) {
            <input class="rename-input" type="text" maxlength="100" [(ngModel)]="renameValue" (keydown.enter)="confirmRenameAsync(collection)" (keydown.escape)="renamingCollectionId = null" autofocus />
            } @else {
            <button class="nav-item" [class.active]="activeCollectionId === collection.id" (click)="selectCollectionAsync(collection.id)">
                <i class="fa-duotone fa-light fa-folder"></i>
                <span>{{ collection.name }}</span>
                <span class="count">{{ collection.itemCount }}</span>
            </button>
            <div class="nav-item-actions">
                <button class="btn-icon-xs" title="Rename" (click)="startRename(collection)">
                    <i class="fa-duotone fa-light fa-pen"></i>
                </button>
                <button class="btn-icon-xs btn-danger" title="Delete" (click)="deleteCollectionAsync(collection)">
                    <i class="fa-duotone fa-light fa-trash"></i>
                </button>
            </div>
            }
        </div>
        }
    </nav>
</div>
